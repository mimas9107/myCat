audio:
  sample_rate: 16000
  chunk_duration_ms: 100
  buffer_seconds: 3
  device_index: null  # null = auto-detect, integer = use specific device

vad:
  threshold: 21000.0

wake_word:
  enabled: false
  threshold: 0.8
  model_path: "models/impulse_model.eim"

asr:
  model_size: "base"
  device: "cpu"
  compute_type: "int8"
  language: "en"
  drop_after_warmup_sec: 5.0  # skip ASR results within this window after warm-load

overlay:
  enabled: true
  idle_yawn_after: 30  # seconds of silence before idle yawn (0 to disable)
